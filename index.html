<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Readarap Street Cipher</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a0033, #330066);
            color: #00ffcc;
            font-family: 'Press Start 2P', system-ui;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 4px solid #00ffcc;
        }
        h1 {
            font-size: 2.8rem;
            margin: 0;
            text-shadow: 0 0 20px #00ffcc;
            letter-spacing: 4px;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #ff00aa;
            margin-top: 10px;
        }
        .level-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
        }
        .level-btn {
            padding: 12px 28px;
            border: 3px solid #00ffcc;
            background: transparent;
            color: #00ffcc;
            font-family: 'Press Start 2P', system-ui;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .level-btn.active, .level-btn:hover {
            background: #00ffcc;
            color: #1a0033;
        }
        .game-area {
            background: rgba(0, 0, 0, 0.4);
            border: 4px solid #ff00aa;
            padding: 30px;
            margin: 20px 0;
        }
        .question {
            font-size: 1.3rem;
            line-height: 1.6;
            margin-bottom: 25px;
            text-align: center;
        }
        .options {
            display: grid;
            gap: 12px;
        }
        .option {
            padding: 16px;
            border: 3px solid #00ffcc;
            background: rgba(0, 255, 204, 0.1);
            color: white;
            font-family: 'Press Start 2P', system-ui;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        .option:hover {
            background: #00ffcc;
            color: #1a0033;
        }
        .option.correct {
            background: #00ff00;
            color: #000;
            border-color: #00ff00;
        }
        .option.wrong {
            background: #ff3366;
            color: white;
            border-color: #ff3366;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
            font-size: 0.9rem;
        }
        .stat {
            background: rgba(255, 0, 170, 0.2);
            padding: 10px 20px;
            border: 2px solid #ff00aa;
        }
        button {
            background: #ff00aa;
            color: white;
            border: none;
            padding: 14px 30px;
            font-family: 'Press Start 2P', system-ui;
            font-size: 1rem;
            cursor: pointer;
            margin: 10px 5px;
        }
        button:hover {
            background: #ff3399;
        }
        .hidden { display: none; }
        .feedback {
            text-align: center;
            font-size: 1.4rem;
            margin: 20px 0;
            min-height: 60px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>READARAP</h1>
            <div class="subtitle">STREET CIPHER</div>
            <p style="margin-top:20px; color:#ff00aa; font-size:0.85rem;">Learn by your favorite song • Syllable Sync & Cadence Key</p>
        </header>

        <div class="level-bar">
            <button class="level-btn active" onclick="setLevel(50)">50% BEGINNER</button>
            <button class="level-btn" onclick="setLevel(75)">75% PROSPECT</button>
            <button class="level-btn" onclick="setLevel(100)">100% EXPERT</button>
        </div>

        <div class="stats">
            <div class="stat">ACCURACY: <span id="accuracy">100</span>%</div>
            <div class="stat">SYLLABLES/MIN: <span id="spm">42</span></div>
            <div class="stat">STREAK: <span id="streak">7</span></div>
        </div>

        <div class="game-area" id="game-area">
            <div class="question" id="question"></div>
            <div class="options" id="options"></div>
            <div class="feedback" id="feedback"></div>
        </div>

        <div style="text-align:center;">
            <button onclick="nextQuestion()">NEXT LINE →</button>
            <button onclick="resetGame()">RESET</button>
        </div>
    </div>

    <script>
        let currentLevel = 50;
        let correct = 0;
        let total = 0;
        let currentStreak = 0;

        const questions = {
            50: [
                { q: "I had to _____ you books today", a: ["show", "kiss", "tell", "meet"], correct: 0 },
                { q: "There's just so many _____ to say", a: ["words", "things", "songs", "days"], correct: 0 },
                { q: "We've been _____ here so long", a: ["learning", "meeting", "waiting", "singing"], correct: 0 },
                { q: "Let's just _____ and say goodbye", a: ["read", "kiss", "dance", "play"], correct: 0 }
            ],
            75: [
                { q: "We need to start our _____ phase", a: ["reading", "singing", "dancing", "playing"], correct: 0 },
                { q: "Embrace the _____, let it renew", a: ["text", "beat", "song", "light"], correct: 0 },
                { q: "Our phonetic _____ feels strong", a: ["path", "road", "way", "line"], correct: 0 },
                { q: "Future _____ waits there for you", a: ["success", "failure", "money", "fame"], correct: 0 }
            ],
            100: [
                { q: "Readarap makes _____ fun", a: ["learning", "singing", "dancing", "eating"], correct: 0 },
                { q: "We're matching _____ with every word", a: ["beats", "words", "notes", "lines"], correct: 0 },
                { q: "We build _____ now you see", a: ["fluency", "music", "poetry", "art"], correct: 0 },
                { q: "With Readarap we reach the _____!", a: ["sky", "ground", "sea", "moon"], correct: 0 }
            ]
        };

        function setLevel(level) {
            currentLevel = level;
            document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            resetGame();
        }

        function loadQuestion() {
            const qList = questions[currentLevel];
            const q = qList[Math.floor(Math.random() * qList.length)];
            
            document.getElementById('question').innerHTML = q.q;
            const opts = document.getElementById('options');
            opts.innerHTML = '';
            
            q.a.forEach((ans, i) => {
                const btn = document.createElement('div');
                btn.className = 'option';
                btn.innerHTML = ans;
                btn.onclick = () => checkAnswer(i, q.correct, btn);
                opts.appendChild(btn);
            });
            
            document.getElementById('feedback').innerHTML = '';
        }

        function checkAnswer(selected, correctIndex, btn) {
            total++;
            const allOptions = document.querySelectorAll('.option');
            allOptions.forEach(opt => opt.onclick = null);
            
            if (selected === correctIndex) {
                correct++;
                currentStreak++;
                btn.classList.add('correct');
                document.getElementById('feedback').innerHTML = '🔥 PERFECT SYNC! 🔥';
                document.getElementById('feedback').style.color = '#00ff00';
            } else {
                currentStreak = 0;
                btn.classList.add('wrong');
                allOptions[correctIndex].classList.add('correct');
                document.getElementById('feedback').innerHTML = 'TRY AGAIN — FEEL THE BEAT';
                document.getElementById('feedback').style.color = '#ff3366';
            }
            
            updateStats();
        }

        function updateStats() {
            const acc = total > 0 ? Math.round((correct / total) * 100) : 100;
            document.getElementById('accuracy').innerHTML = acc;
            document.getElementById('streak').innerHTML = currentStreak;
            document.getElementById('spm').innerHTML = 38 + Math.floor(Math.random() * 12);
        }

        function nextQuestion() {
            loadQuestion();
        }

        function resetGame() {
            correct = 0;
            total = 0;
            currentStreak = 0;
            updateStats();
            loadQuestion();
        }

        window.onload = () => {
            loadQuestion();
            updateStats();
        };
    </script>
</body>
</html>
